<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASOUL vs A87</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 20% 20%, rgba(60, 198, 231, 0.13), transparent 34%),
          radial-gradient(circle at 80% 80%, rgba(255, 86, 151, 0.1), transparent 38%),
          #050a16;
        overflow: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: auto;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(103, 231, 255, 0.18),
          0 24px 80px rgba(0, 0, 0, 0.72),
          0 0 50px rgba(58, 205, 235, 0.08);
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
