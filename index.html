<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASOUL vs A87</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.82), transparent 28%),
          radial-gradient(circle at 82% 78%, rgba(255, 218, 139, 0.5), transparent 34%),
          linear-gradient(145deg, #bcefff, #eaf9ef 58%, #fff0d2);
        overflow: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: auto;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.82),
          0 24px 70px rgba(80, 113, 126, 0.24),
          0 0 46px rgba(108, 207, 221, 0.16);
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
